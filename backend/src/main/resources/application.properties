# =====================================================================
# MeGo Backend - Application Properties (Dev Environment)
# =====================================================================

spring.application.name=mego-backend

# ---------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------
# Gia tri ben duoi chi dung cho moi truong development/local.
# Production nen su dung bien moi truong JWT_SECRET hoac Secret Manager.
# Do dai toi thieu khuyen nghi: 32 ky tu (256 bit) cho HMAC-SHA256.

jwt.secret=${JWT_SECRET:mego-dev-secret-key-change-in-production-min-32-chars}
jwt.expiration-ms=86400000

# ---------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------
# Danh sach origin duoc phep truy cap API.
# Cac origin duoc phan cach bang dau phay.

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

server.port=8080

# ---------------------------------------------------------------------
# Datasource - MariaDB
# ---------------------------------------------------------------------

spring.datasource.url=jdbc:mariadb://localhost:3306/mego_hotel_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---------------------------------------------------------------------
# HikariCP Connection Pool
# ---------------------------------------------------------------------

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------

# Tu dong cap nhat database schema trong moi truong development.
spring.jpa.hibernate.ddl-auto=update

# Tat Open Session in View de tranh lazy loading ngoai transaction.
spring.jpa.open-in-view=false

# Hien thi SQL trong console khi development.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dong bo timezone cua Hibernate voi UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Batch insert/update de cai thien hieu nang.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------

spring.jackson.time-zone=UTC

# ---------------------------------------------------------------------
# Mail - Gmail SMTP
# ---------------------------------------------------------------------

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000