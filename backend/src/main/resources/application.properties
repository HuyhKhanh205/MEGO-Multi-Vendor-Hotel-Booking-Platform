# =====================================================================
# MeGo Backend – Application Properties (Dev Environment)
# =====================================================================

spring.application.name=mego-backend
server.port=8080

# ---------------------------------------------------------------------
# Datasource – MariaDB
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mariadb://localhost:3306/mego_hotel_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# Tự động cập nhật schema khi dev; đổi thành validate/none trên prod
spring.jpa.hibernate.ddl-auto=update

# Luôn dùng dialect MariaDB (Hibernate 7 tự detect, nhưng khai báo rõ để an toàn)
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Tắt Open-Session-In-View để tránh lazy loading ngoài transaction
spring.jpa.open-in-view=false

# Hiển thị SQL trong log (tắt trên prod)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Đồng bộ timezone với UTC – tránh lệch giờ khi lưu LocalDateTime
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Batch insert/update cho hiệu năng tốt hơn
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ---------------------------------------------------------------------
# Mail (cấu hình placeholder – điền thông tin thực khi deploy)
# ---------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
